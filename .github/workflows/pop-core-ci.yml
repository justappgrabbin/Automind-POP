name: POP core regression

on:
  push:
    branches: [main, integration/automind-conductor]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bundled runtime sources
        run: |
          test -f vendor/synthai/core/kernel.mjs
          test -f vendor/synthai/runtime/execution.mjs
          test -f vendor/biverse/biverse/dimensional.py || find vendor/biverse -name '*dimensional*' -print -quit
      - name: Run POP JavaScript regressions
        run: npm test
      - name: Verify persisted address and failure recovery across processes
        run: bash tests/address-cli.sh
